<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Свадебное приглашение</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preload" href="assets/forest.mp4" as="video">
</head>
<body>
  <section class="video-section">
    <div class="video-wrapper">
      <video id="wedding-video" autoplay muted loop playsinline webkit-playsinline>
        <source src="assets/forest.mp4" type="video/mp4">
      </video>
      <div class="names-plate">Анна & Иван</div>
    </div>
  </section>

  <!-- Картинка как отдельный блок после видео -->
  <section class="image-section">
    <div class="image-wrapper">
      <img src="assets/forest.png" alt="Лес" id="under-video-image">
    </div>
  </section>

  <div class="transition-block">
  <img src="assets/flowers_divider.png" alt="Разделитель" />
</div>

  <section class="content-section">
    <div class="content-wrapper">
      <h2>Мы женимся!</h2>
      <p>25 августа 2025 года</p>
      <p>Ресторан "Лаванда", 15:00</p>
      <div style="height: 200vh"></div>
    </div>
  </section>

  <script src="script.js"></script>
</body>
</html>
