<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Приглашение на свадьбу</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="video-section">
      <div class="video-wrapper">
        <div class="names-plate">
          <img
            src="assets/we_marry.png"
            alt="Анастасия и Егор"
            class="names-image-plate"
          />
        </div>

        <!-- Картинка по умолчанию для всех -->
        <img
          id="default-image"
          src="assets/forest_with_us.jpg"
          alt="Forest with couple"
          class="default-media"
        />

        <!-- Видео будет показано только для не-iOS устройств -->
        <video
          id="wedding-video"
          autoplay
          muted
          loop
          playsinline
          style="display: none"
        >
          <source src="assets/forest.mp4" type="video/mp4" />
        </video>
      </div>
    </div>

    <!-- остальной код без изменений -->
    <div class="transition-block">
      <img src="assets/flowers_divider.png" alt="Transition" />
    </div>

    <div class="image-section">
      <div class="image-wrapper">
        <!-- Для всех используем forest_with_us.jpg -->
        <img
          id="under-video-image"
          src="assets/forest_with_us.jpg"
          alt="Forest background"
        />
        <div class="gradient-overlay"></div>
      </div>
    </div>

    <!-- <div style="height: 40px"></div> -->
    <div class="content-section">
      <p
        style="
          font-family: 'beaumarchaisc';
          text-align: center;
          font-size: clamp(32px, 10vw, 64px);
          line-height: 1.2;
          margin: 0;
        "
      >
        Карта приключений
      </p>
      <div style="height: 40px"></div>
      <img
        src="assets/event_map.jpg"
        alt="Event map"
        style="
          width: 100%;
          max-width: 100%;
          padding: 0 10px;
          box-sizing: border-box;
        "
      />

      <!-- Добавленный текст -->
      <div style="margin-top: 60px; text-align: center; padding: 0 20px">
        <p
          style="
            font-family: 'Faberge';
            font-size: clamp(20px, 4vw, 28px);
            line-height: 1.4;
            margin-bottom: 20px;
          "
        >
          И чтобы сделать праздник<br />
          действительно волшебным,<br />
          мы просим вас...
        </p>
        <p
          style="
            font-family: 'beaumarchaisc';
            font-size: clamp(24px, 6vw, 48px);
            line-height: 0.5;
            margin: 0;
          "
        >
          Перевоплотиться!
        </p>
      </div>

      <!-- Карусель с фото гостей - ОБНОВЛЕННАЯ CSS ВЕРСИЯ -->
      <div class="guests-section">
        <div class="carousel-container">
          <div class="carousel-scroll" id="carousel-scroll">
            <div class="carousel-card">
              <img src="assets/guest1.jpg" alt="Гость 1" loading="lazy" />
            </div>
            <div class="carousel-card">
              <img src="assets/guest2.jpg" alt="Гость 2" loading="lazy" />
            </div>
            <div class="carousel-card">
              <img src="assets/guest3.jpg" alt="Гость 3" loading="lazy" />
            </div>
            <div class="carousel-card">
              <img src="assets/guest4.jpg" alt="Гость 4" loading="lazy" />
            </div>
            <div class="carousel-card">
              <img src="assets/guest5.jpg" alt="Гость 5" loading="lazy" />
            </div>
            <div class="carousel-card">
              <img src="assets/guest6.jpg" alt="Гость 6" loading="lazy" />
            </div>
          </div>

          <!-- Кнопки управления (только для десктопа) -->
          <div class="carousel-controls">
            <button class="carousel-btn prev-btn" aria-label="Предыдущее фото">
              ⟵
            </button>
            <button class="carousel-btn next-btn" aria-label="Следующее фото">
              ⟶
            </button>
          </div>
        </div>
      </div>

      <div style="height: 40px"></div>

      <!-- Добавленный текст про магический свиток -->
      <div style="text-align: center; padding: 0 20px">
        <p
          style="
            font-family: 'Faberge';
            font-size: clamp(20px, 4vw, 28px);
            line-height: 1.4;
            margin: 0;
          "
        >
          Мы ждем вашего ответа через этот магический свиток
        </p>
      </div>

      <!-- Блок со свитком и кастомной формой -->
      <div style="margin-top: 40px; display: flex; justify-content: center">
        <div class="scroll-form-container">
          <!-- Верхняя часть свитка -->
          <img
            src="assets/scroll_top.png"
            alt="Верх свитка"
            class="scroll-top"
          />

          <!-- Тело свитка с формой -->
          <div class="scroll-body">
            <form id="wedding-form" class="wedding-form">
              <!-- Поле имени -->
              <div class="form-group">
                <label for="guest-name" class="form-label"
                  >Силы магии, внемлите моим словам! Моё имя в этом мире:</label
                >
                <input
                  type="text"
                  id="guest-name"
                  name="guest-name"
                  class="form-input"
                  placeholder="Имя и фамилия"
                  required
                />
              </div>

              <!-- Радио-кнопки -->
              <div class="form-group">
                <label class="form-label">Вы придете на праздник?</label>
                <div class="radio-group">
                  <label class="radio-label">
                    <input type="radio" name="attendance" value="yes" />
                    <span class="radio-custom"></span>
                    Да, с радостью!
                  </label>
                  <label class="radio-label">
                    <input type="radio" name="attendance" value="no" />
                    <span class="radio-custom"></span>
                    К сожалению, не смогу
                  </label>
                  <label class="radio-label">
                    <input type="radio" name="attendance" value="maybe" />
                    <span class="radio-custom"></span>
                    Пока не знаю
                  </label>
                </div>
              </div>

              <!-- Чекбоксы -->
              <div class="form-group">
                <label class="form-label"
                  >Что вы предпочитаете из напитков?</label
                >
                <div class="checkbox-group">
                  <label class="checkbox-label">
                    <input type="checkbox" name="drinks" value="wine" />
                    <span class="checkbox-custom"></span>
                    Вино Алто
                  </label>
                  <label class="checkbox-label">
                    <input type="checkbox" name="drinks" value="mead" />
                    <span class="checkbox-custom"></span>
                    Нордский мёд
                  </label>
                  <label class="checkbox-label">
                    <input type="checkbox" name="drinks" value="vodka" />
                    <span class="checkbox-custom"></span>
                    Краснолюдский спирт
                  </label>
                  <label class="checkbox-label">
                    <input type="checkbox" name="drinks" value="juice" />
                    <span class="checkbox-custom"></span>
                    Нектар (сок)
                  </label>
                  <label class="checkbox-label">
                    <input type="checkbox" name="drinks" value="water" />
                    <span class="checkbox-custom"></span>
                    Вода
                  </label>
                  <label class="checkbox-label">
                    <input type="checkbox" name="drinks" value="mors" />
                    <span class="checkbox-custom"></span>
                    Зелье лечения (морс)
                  </label>
                </div>
              </div>

              <!-- Текстовое поле -->
              <div class="form-group">
                <label for="guest-message" class="form-label"
                  >Если у вас есть аллергии или пищевые ограничения, напишите
                  их</label
                >
                <textarea
                  id="guest-message"
                  name="guest-message"
                  class="form-textarea"
                  rows="4"
                ></textarea>
              </div>

              <!-- Кнопка отправки -->
              <button type="submit" class="submit-btn">
                Скрепить магией и отправить
              </button>
            </form>
          </div>

          <!-- Нижняя часть свитка -->
          <img
            src="assets/scroll_bottom.png"
            alt="Низ свитка"
            class="scroll-bottom"
          />
        </div>
      </div>
    </div>

    <!-- Блок с фото жениха и невесты в арке и информацией -->
    <div style="position: relative; padding: 40px 20px; margin: 80px 0">
      <!-- Угловые цветы слева -->
      <div style="position: absolute; top: 0; left: 0; z-index: 2">
        <img
          src="assets/flowers_corner.png"
          alt="Цветы"
          style="width: 200px; height: auto"
        />
      </div>

      <!-- Угловые цветы справа (зеркальные) -->
      <div
        style="
          position: absolute;
          top: 0;
          right: 0;
          z-index: 2;
          transform: scaleX(-1);
        "
      >
        <img
          src="assets/flowers_corner.png"
          alt="Цветы"
          style="width: 200px; height: auto"
        />
      </div>

      <!-- Контейнер для арки и информации -->
      <div class="couple-info-container">
        <!-- Арка с фото -->
        <div class="couple-arch">
          <img
            src="assets/arc_2.png"
            alt="Жених и невеста"
            class="arch-image"
          />
        </div>

        <!-- Информационная колонка -->
        <div class="info-column">
          <!-- Заголовок -->
          <h1 class="info-title">Очень ждем Вас на нашей свадьбе</h1>

          <!-- Вертикальный отступ 44px -->
          <div class="spacer-44"></div>

          <!-- Картинка с именами -->
          <img
            src="assets/our_names.png"
            alt="Анастасия и Егор"
            class="names-image"
          />

          <!-- Вертикальный отступ 70px -->
          <div class="spacer-70"></div>

          <!-- Контактная информация -->
          <div class="contact-info">
            <p class="contact-text">
              По всем вопросам можно писать<br />
              прекрасной фее Элине
            </p>
            <p class="contact-links">
              <a href="tel:+79136243383" class="contact-link"
                >+7 (913) 624 33-83</a
              ><br />
              <a
                href="https://t.me/acidyouth"
                target="_blank"
                class="contact-link"
                >tg: @acidyouth</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
